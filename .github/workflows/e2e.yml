name: Playwright E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Generate ephemeral demo passwords
        # Fresh, random per run — never a fixed value, never printed. GITHUB_ENV makes both of
        # these available, unmasked only in-process, to every later step: the Compose stack that
        # seeds the demo accounts and the Playwright step that logs in with them.
        run: |
          for name in IWRITE_DEMO_AUTOR_A_PASSWORD IWRITE_DEMO_AUTOR_B_PASSWORD; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            # /api/books requires a session now; /ping is the backend's unauthenticated liveness
            # probe, so readiness no longer depends on the demo seed having finished.
            if curl --fail --silent http://localhost:8086/ping > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.e2e.yml logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3001 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.e2e.yml logs frontend
          exit 1

      - name: Run Playwright E2E
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
