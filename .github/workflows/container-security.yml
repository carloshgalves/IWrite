name: Container Security

on:
  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "web/Dockerfile"
      - "pom.xml"
      - ".mvn/**"
      - "src/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/src/**"
      - "web/public/**"
      - "web/server.mjs"
      - "web/next.config.ts"
      - "docker/start.sh"
      - ".github/workflows/container-security.yml"
  workflow_dispatch:
  schedule:
    # Weekly, independent of the E2E schedule, to catch CVEs published after merge.
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
            image: iwrite-app
          - name: frontend
            dockerfile: web/Dockerfile
            context: web
            image: iwrite-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build image
        run: |
          docker build \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ matrix.image }}:scan-${{ github.sha }}" \
            "${{ matrix.context }}"

      # Full HIGH+CRITICAL report, including vulnerabilities without a known fix yet.
      # Never fails the job by itself — the CRITICAL gate below does that.
      - name: Scan report (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:scan-${{ github.sha }}"
          format: json
          output: "trivy-report-${{ matrix.name }}.json"
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:scan-${{ github.sha }}"
          format: cyclonedx
          output: "${{ matrix.image }}-sbom.cdx.json"

      - name: Upload scan report and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: "container-security-${{ matrix.name }}"
          path: |
            trivy-report-${{ matrix.name }}.json
            ${{ matrix.image }}-sbom.cdx.json
          retention-days: 14
          if-no-files-found: error

      # Gate runs last so the report/SBOM are always uploaded first: a CRITICAL finding fails this
      # job, it is never silenced with continue-on-error or an allowlist.
      - name: Enforce CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:scan-${{ github.sha }}"
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: "1"
