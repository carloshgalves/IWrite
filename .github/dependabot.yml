version: 2

updates:
  # Backend (Maven) dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"
      maven-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"
    # Framework line changes are explicit compatibility work. Keep automatic maintenance to
    # patches on the selected Spring Boot/Spring AI lines; all majors remain manual.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "org.springframework.ai:spring-ai-bom"
        update-types:
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(deps)"

  # Frontend (npm) dependencies
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Keep the framework and its lint/types surface in one coherent PR.
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # TipTap minors can change editor semantics, but may also contain security fixes.
      # Keep them visible and isolated instead of mixing them with generic tooling.
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@tiptap/*"
        update-types:
          - "minor"
          - "patch"
    # Major frontend upgrades are explicit migration work. Next/React framework-line minors are
    # also deliberate; patches remain automated. TipTap minors stay visible in their own group.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(ci)"

  # Root Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Dependabot parses the composite Maven image tag as a Maven version and can therefore treat
    # 3.9.x-eclipse-temurin-21 -> 3.9.x-eclipse-temurin-26 as a minor update. That silently changes
    # IWrite's Java baseline. The Maven builder image is maintained manually while Java 21 is pinned.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "maven"
    commit-message:
      prefix: "chore(docker)"

  # Frontend Dockerfile base images
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(docker)"

  # Docker Compose service images (docker-compose*.yml at repo root)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # PostgreSQL and other service-image majors require explicit compatibility/migration validation.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(docker)"
