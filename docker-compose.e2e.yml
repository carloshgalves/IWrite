services:
  db:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_DB: iwrite_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      # Versioned to force a clean PostgreSQL initialization after the E2E logical database was renamed to iwrite_e2e.
      - iwrite_e2e_pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iwrite_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/iwrite_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3001
      # The suite authenticates before it does anything, so the stack needs an account.
      SPRING_PROFILES_ACTIVE: demo
      IWRITE_DEMO_SEED_ENABLED: "true"
      IWRITE_DEMO_AUTOR_A_PASSWORD: ${IWRITE_DEMO_AUTOR_A_PASSWORD:?defina no .env, sem valor padrão}
      IWRITE_DEMO_AUTOR_B_PASSWORD: ${IWRITE_DEMO_AUTOR_B_PASSWORD:?defina no .env, sem valor padrão}
      # Same trust boundary as docker-compose.yml: only the frontend container may supply a
      # forwarded client address.
      IWRITE_AUTH_TRUSTED_PROXIES: frontend
    ports:
      # docker/start.sh pins the Spring port at 8085 inside the image (the combined image proxies
      # to 127.0.0.1:8085), so SERVER_PORT here never took effect. Publish the real port instead.
      - "8086:8085"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BACKEND_ORIGIN: http://backend:8085
    environment:
      BACKEND_ORIGIN: http://backend:8085
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  iwrite_e2e_pgdata_v2:
