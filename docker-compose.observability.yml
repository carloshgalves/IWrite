# Override opcional para desenvolvimento/diagnóstico: sobe um LGTM (Grafana +
# Tempo + Loki + Mimir/Prometheus) local sem autenticação e aponta o backend
# para ele. Não usar em produção; produção deve configurar um backend OTLP
# próprio/gerenciado por ambiente.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# UI do Grafana em http://localhost:3001 (a porta 3000 do host já é usada
# pelo frontend Next.js; a porta interna do container permanece 3000).
services:
  otel-lgtm:
    # Versão/digest validados em 2026-08-01; ver docs/opentelemetry-implementation.md.
    image: grafana/otel-lgtm:0.30.0@sha256:46ca028e294bd728e8e930a28e887f640a8f2a9533cc283f79bcc6ab73d2ffd8
    container_name: iwrite-otel-lgtm
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"

  backend:
    environment:
      IWRITE_OTEL_ENABLED: "true"
      IWRITE_OTEL_AUTH_REQUIRED: "false"
      OTEL_SERVICE_NAME: iwrite-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # Exporta os key-value pairs do SLF4J 2 como atributos do log record, que
      # é o que torna os eventos de negócio pesquisáveis no Loki por campo em
      # vez de por texto da mensagem. Equivale à propriedade
      # otel.instrumentation.logback-appender.experimental.capture-key-value-pair-attributes=true
      #
      # Deliberadamente NÃO habilitamos capture-mdc-attributes=* nem
      # capture-arguments=true: ambos exportam texto livre não revisado.
      # Ver docs/otel-correlated-logs.md.
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES: "true"
      # Explicita a sanitização de db.statement (já é o default do agente).
      OTEL_INSTRUMENTATION_COMMON_DB_STATEMENT_SANITIZER_ENABLED: "true"
    depends_on:
      otel-lgtm:
        condition: service_started
